[package]
name = "luckycommons-solana"
version = "0.1.0"
description = "Lucky Commons custody and licensing positions for Solana NFTs"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lucky_commons_solana"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", features = ["associated_token", "token", "token_2022"] }
mpl-core = { version = "0.12.1", default-features = false, features = ["anchor-0-32"] }
mpl-token-metadata = "5.1.1"
